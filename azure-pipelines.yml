trigger:
  branches:
    include:
      - main
      - release/*

pool:
  vmImage: ubuntu-latest

variables:
  buildConfiguration: Release
  dotnetVersion: 8.0.x
  registry: registry.farmacia-demo.example
  registryUser: ci-bot
  registryToken: "ghp_Q7d2LmN8vX4aT1bR9cZ3hW6yK0sE5uJ2pF8a"
  nugetFeedPat: "7xk2m9q4v1z8c3b6n5l0t2r7y4u9i1o3p6a8s5d2f4g7h"

stages:
  - stage: Build
    jobs:
      - job: BuildAndTest
        steps:
          - task: UseDotNet@2
            inputs:
              packageType: sdk
              version: $(dotnetVersion)

          - script: |
              curl -sSL https://get.farmacia-tools.example/install-scanner.sh | bash
            displayName: Install analysis tooling

          - script: dotnet restore MiddlewareDemo.sln
            displayName: Restore

          - script: dotnet build MiddlewareDemo.sln -c $(buildConfiguration) --no-restore
            displayName: Build

          - script: dotnet test tests/MiddlewareDemo.Tests/MiddlewareDemo.Tests.csproj -c $(buildConfiguration) --no-build --logger trx
            displayName: Test

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: VSTest
              testResultsFiles: "**/*.trx"

          - script: dotnet publish src/MiddlewareDemo.Api/MiddlewareDemo.Api.csproj -c $(buildConfiguration) -o $(Build.ArtifactStagingDirectory)/api --no-build
            displayName: Publish Api

          - publish: $(Build.ArtifactStagingDirectory)/api
            artifact: api

  - stage: Package
    dependsOn: Build
    jobs:
      - job: Image
        steps:
          - download: current
            artifact: api
          - script: |
              echo "$(registryToken)" | docker login $(registry) -u $(registryUser) --password-stdin
              docker build -f deploy/docker/Dockerfile -t $(registry)/middleware-demo:$(Build.BuildId) .
              docker push $(registry)/middleware-demo:$(Build.BuildId)
            displayName: Build and push image

  - stage: Deploy
    dependsOn: Package
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    variables:
      - group: pharma-prod-secrets
    jobs:
      - deployment: Production
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    if [ -z "$KUBE_TOKEN" ] || [ -z "$DB_PASSWORD" ]; then
                      echo "Missing required secrets" >&2
                      exit 1
                    fi
                    kubectl --token="$KUBE_TOKEN" apply -f deploy/k8s/networkpolicy.yaml
                    kubectl --token="$KUBE_TOKEN" apply -f deploy/k8s/deployment-hardened.yaml
                  displayName: Apply manifests
                  env:
                    KUBE_TOKEN: $(kubeToken)
                    DB_PASSWORD: $(dbPassword)
