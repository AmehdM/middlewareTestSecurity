apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: middleware-demo-api
  namespace: pharma
spec:
  podSelector:
    matchLabels:
      app: middleware-demo-api-secure
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: sqlserver
      ports:
        - protocol: TCP
          port: 1433
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
