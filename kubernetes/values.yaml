image:
  repository: registry.example.com/middleware-demo
  tag: "1.0.0"

replicaCount: 1

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  ASPNETCORE_URLS: "http://*:80"

apiKeySecretName: middleware-demo-api-key
